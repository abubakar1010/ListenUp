# AI providers per role (Architecture 7.2 and 7.5, NFR-AI-2, ADR 0028).
#
# Each role lists providers in order of preference; the gateway tries eligible entries in order. To switch
# provider, change this file (or point LISTENUP_AI_CONFIG at another one): no code
# changes. Every switch is gated by the golden-set regression run (NFR-AI-6).
# `version` is the file format; history lives in git.
version: 1
saving_mode: true  # ADR 0037; rounds 1/2 use grading templates
# Text AI (#66, ADR 0046): key points and gist grading try the hosted free tier first and
# the self-hosted model only when it is skipped (quota, eligibility, invalid output);
# round feedback keeps the hosted allowance for grading and goes local first (ADR 0037).
tasks:
  extract_key_points: [groq, ollama]
  grade_gist: [groq, ollama]
  shadow_feedback: [ollama, groq]
# Token budgets per task (System Design 7.3). Input is measured as UTF-8 bytes of the JSON
# input, one byte per token (conservative); a reservation is input + output, which must
# stay under Groq's 8,000 tokens per minute. `prompt_tokens` is the prompt file's overhead.
task_budgets:
  extract_key_points: {input_tokens: 7000, output_tokens: 512, prompt_tokens: 700}
  grade_gist: {input_tokens: 7000, output_tokens: 700, prompt_tokens: 900}
  shadow_feedback: {input_tokens: 1536, output_tokens: 400, prompt_tokens: 500}
roles:
  transcription:
    - provider: faster-whisper
      local: true
      trains_on_inputs: false
      model: small.en  # spike #18 (B1, ADR 0034): 0.54 core-s per audio-s, 3.9% Dictation WER
      timeout_seconds: 600  # a 15-minute passage at about 0.3x real time on 2 threads, with headroom
      retries: 0  # local CPU work: a timeout will not pass on retry
      preload: true
      options:
        compute_type: int8
        cpu_threads: 2  # matches OMP_NUM_THREADS in the worker-media image
        beam_size: 5  # 1 saves 32% CPU for +0.1 points of WER (ADR 0034)
        vad_filter: true
  alignment:
    - provider: wav2vec2-ctc
      local: true
      trains_on_inputs: false
      model: WAV2VEC2_ASR_BASE_960H  # ADR 0034 candidate; corrected B2 validation pending
      timeout_seconds: 300
      retries: 0
      preload: true
      options:
        threads: 2
        window_seconds: 30  # bounded emission windows; rerun B2 with production preprocessing
        int8: true  # dynamic int8 linear layers; record this choice in provenance
  # No adapter yet: Shadow grading (#20, #21) adds one.
  speech_assessment: []
  text_ai:
    # Hosted free tier. Disabled until the operator has verified the organisation's limits,
    # zero data retention, allowed regions and populations, and the golden set passes
    # (ADR 0037, NFR-AI-6). Never put the key here: LISTENUP_AI_GROQ_API_KEY holds it.
    - provider: groq
      model: openai/gpt-oss-20b
      enabled: false
      accepted: false
      retention_verified: false
      trains_on_inputs: false  # Services Agreement 4.2, read 2026-10-11 (ADR 0037)
      regions: []
      populations: []
      timeout_seconds: 15
      retries: 1
      retry_backoff_seconds: 1
      # B6 spike: 30 RPM, 8K TPM, 1,000 RPD, 200K TPD. Monthly figures are calculated
      # ceilings (30 x daily), not published limits: replace with the organisation's own.
      limits:
        minute: {calls: 30, tokens: 8000}
        day: {calls: 1000, tokens: 200000}
        month: {calls: 30000, tokens: 6000000}
      projected_input_cost_per_million: 0.075
      projected_output_cost_per_million: 0.30
      options:
        base_url: https://api.groq.com/openai/v1
        api_key_env: LISTENUP_AI_GROQ_API_KEY
        structured_output: json_schema
        reasoning_effort: low
    # Self-hosted fallback: the optional `llm` Compose service (profile `llm`). Idle and
    # not running by default, so it takes no CPU from speech work (System Design 5.2).
    - provider: ollama
      model: qwen3:4b-instruct
      local: true
      enabled: false
      accepted: false
      trains_on_inputs: false
      timeout_seconds: 30
      retries: 0
      options:
        base_url: http://llm:11434/v1
        structured_output: json_schema
