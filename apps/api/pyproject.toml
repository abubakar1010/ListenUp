[project]
name = "listenup"
version = "0.1.0"
description = "ListenUp backend: FastAPI API and Procrastinate workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "procrastinate>=2.0",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Self-hosted speech models for the media worker only (ADR 0028); the API, the default
# worker and CI do without them. torch and torchaudio (wav2vec2 alignment) are installed
# in the worker-media image from the PyTorch CPU index instead, because the PyPI wheels
# bundle CUDA libraries the CPU server never uses.
speech = ["faster-whisper>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
    "types-boto3[s3]>=1.35",
    "hypothesis>=6.168.3",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listenup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["listenup", "migrations", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["listenup"]

# Speech libraries live in the `speech` extra and the worker-media image only; their
# adapters import them lazily (ADR 0028).
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "torch", "torch.*", "torchaudio", "torchaudio.*"]
ignore_missing_imports = true

# Module boundaries from Architecture section 4.3, checked by `uv run lint-imports`.
# The rule that modules call each other only through service.py is checked by
# tests/architecture/test_module_boundaries.py.
[tool.importlinter]
root_package = "listenup"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain packages import no framework, database or network code"
type = "forbidden"
source_modules = ["listenup.modules.*.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "psycopg", "procrastinate", "httpx", "listenup.platform", "listenup.ai"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "practice never imports a mode module"
type = "forbidden"
source_modules = ["listenup.modules.practice"]
forbidden_modules = ["listenup.modules.blind", "listenup.modules.dictation", "listenup.modules.review", "listenup.modules.cards", "listenup.modules.shadow"]

[[tool.importlinter.contracts]]
name = "Only grading and transcript call the AI layer"
type = "forbidden"
source_modules = ["listenup.modules.identity", "listenup.modules.content", "listenup.modules.practice", "listenup.modules.blind", "listenup.modules.dictation", "listenup.modules.review", "listenup.modules.cards", "listenup.modules.shadow", "listenup.modules.library", "listenup.modules.notifications", "listenup.modules.admin", "listenup.main"]
forbidden_modules = ["listenup.ai"]

[[tool.importlinter.contracts]]
name = "The AI layer depends only on platform"
type = "forbidden"
source_modules = ["listenup.ai"]
forbidden_modules = ["listenup.modules", "listenup.main", "listenup.worker"]
