# Local development stack. Start it from the repository root with `docker compose up`.
# The web client runs outside Compose with the Vite dev server (apps/web: pnpm dev).

x-backend-env: &backend-env
  LISTENUP_ENVIRONMENT: local
  LISTENUP_DATABASE_URL: postgresql://listenup:listenup@postgres:5432/listenup
  LISTENUP_S3_ENDPOINT_URL: http://storage:9000
  # Signed URLs go to the browser, which reaches storage on the host port.
  LISTENUP_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  LISTENUP_S3_BUCKET: listenup
  LISTENUP_SMTP_HOST: mailpit
  LISTENUP_SMTP_PORT: "1025"
  # Traces and metrics stay off unless started with LISTENUP_OTEL_ENABLED=true and the
  # observability profile (ADR 0031): Jaeger at :16686, Prometheus at :9090.
  LISTENUP_OTEL_ENABLED: ${LISTENUP_OTEL_ENABLED:-false}
  LISTENUP_OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  LISTENUP_OTEL_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics

x-backend: &backend
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  environment: *backend-env
  volumes:
    # Live code for local development; the package is installed in editable mode.
    - ../../apps/api/src:/app/src:ro
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listenup
      POSTGRES_PASSWORD: listenup
      POSTGRES_DB: listenup
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listenup -d listenup"]
      interval: 2s
      retries: 30

  # S3-compatible object storage for local development (SeaweedFS; MinIO images are no
  # longer published on Docker Hub). Production uses any S3-compatible provider.
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - storage-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "echo cluster.check | weed shell -master=localhost:9333 >/dev/null 2>&1"]
      interval: 3s
      retries: 40

  storage-bucket:
    image: chrislusf/seaweedfs:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name listenup' | weed shell -master=storage:9333"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # Applies the database migrations, including the job-queue schema (migration 0003).
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: worker
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    healthcheck:
      disable: true

  api:
    <<: *backend
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    # Open event streams would otherwise hold up a reload or shutdown until browsers leave.
    command: uvicorn listenup.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src --timeout-graceful-shutdown 5
    ports: ["8000:8000"]

  worker:
    <<: *backend
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: worker

  worker-media:
    <<: *backend
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: worker-media
    volumes:
      - ../../apps/api/src:/app/src:ro
      # Speech models (ADR 0028), downloaded on the first start and kept here.
      - ai-models:/models

  # Nightly pg_dump to object storage, kept 14 days (ADR 0032). Opt in locally with
  # `docker compose --profile backup up backup`; production always runs it.
  backup:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: backup
    profiles: [backup]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      storage-bucket:
        condition: service_completed_successfully

  # Self-hosted observability (ADR 0031): `LISTENUP_OTEL_ENABLED=true docker compose
  # --profile observability up`. Alerts are emailed to Mailpit.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [observability]
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    ports: ["9093:9093"]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  postgres-data:
  storage-data:
  prometheus-data:
  ai-models:
