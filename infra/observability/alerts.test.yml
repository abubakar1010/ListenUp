# Unit tests for alerts.yml: `promtool test rules alerts.test.yml` (run in CI).
# Series values use promtool's expanding notation: `0+10x30` is 0, 10, 20, ... 300.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Simulated quota at 15% fires; 25% and 100% do not (#96 acceptance criterion).
  - interval: 1m
    input_series:
      - series: 'listenup_ai_quota_remaining_ratio{provider="groq"}'
        values: '0.15x10'
      - series: 'listenup_ai_quota_remaining_ratio{provider="gemini"}'
        values: '0.25x10'
      - series: 'listenup_ai_quota_remaining_ratio{provider="whisper-local"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: AiQuotaLow
        exp_alerts: []  # still pending: the rule waits 2 minutes
      - eval_time: 5m
        alertname: AiQuotaLow
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: groq
            exp_annotations:
              summary: "groq has 15% of its free quota left"
              runbook_url: "docs/runbooks/alerts.md#aiquotalow"

  # Simulated grading failures over 5% fire (6 of 100 per 10 minutes); 4% do not.
  - interval: 1m
    input_series:
      - series: 'listenup_grading_results_total{kind="gist",outcome="ok"}'
        values: '0+9.4x60'
      - series: 'listenup_grading_results_total{kind="gist",outcome="failed"}'
        values: '0+0.6x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: GradingFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "6% of gradings are failing"
              runbook_url: "docs/runbooks/alerts.md#gradingfailureratehigh"
  - interval: 1m
    input_series:
      - series: 'listenup_grading_results_total{kind="gist",outcome="ok"}'
        values: '0+9.6x60'
      - series: 'listenup_grading_results_total{kind="gist",outcome="failed"}'
        values: '0+0.4x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: GradingFailureRateHigh
        exp_alerts: []
  # Too few gradings to judge: 1 failure of 10 does not page.
  - interval: 1m
    input_series:
      - series: 'listenup_grading_results_total{kind="shadow_round",outcome="ok"}'
        values: '0+0.3x60'
      - series: 'listenup_grading_results_total{kind="shadow_round",outcome="failed"}'
        values: '0+0.033x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: GradingFailureRateHigh
        exp_alerts: []

  # A backlog that keeps growing fires; a large but shrinking one does not.
  - interval: 1m
    input_series:
      - series: 'listenup_job_backlog{lane="intake"}'
        values: '0+1x60'
      - series: 'listenup_job_backlog{lane="ai"}'
        values: '60-1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: JobBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              lane: intake
            exp_annotations:
              summary: "Job backlog on lane intake keeps growing (45 due)"
              runbook_url: "docs/runbooks/alerts.md#jobbackloggrowing"

  # Waits past each lane's limit fire; a short wait on the speech lane does not.
  - interval: 1m
    input_series:
      - series: 'listenup_job_oldest_wait_seconds{lane="ai"}'
        values: '45x10'
      - series: 'listenup_job_oldest_wait_seconds{lane="speech-interactive"}'
        values: '20x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: JobWaitTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              lane: ai
            exp_annotations:
              summary: "Oldest job on lane ai has waited 45s"
              runbook_url: "docs/runbooks/alerts.md#jobwaittoolong"

  # The queue sampler stopped: its heartbeat is 20 minutes old.
  - interval: 1m
    input_series:
      - series: 'listenup_job_queue_sampled_timestamp_seconds'
        values: '-1200x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: JobQueueSamplerStopped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The job queue has not been sampled for over 5 minutes"
              runbook_url: "docs/runbooks/alerts.md#jobqueuesamplerstopped"
  # A fresh heartbeat raises nothing.
  - interval: 1m
    input_series:
      - series: 'listenup_job_queue_sampled_timestamp_seconds'
        values: '0+60x60'  # the heartbeat keeps up with the clock
    alert_rule_test:
      - eval_time: 30m
        alertname: JobQueueSamplerStopped
        exp_alerts: []
  # No heartbeat at all (the default pool is down) raises it as well.
  - interval: 1m
    input_series:
      - series: 'listenup_job_backlog{lane="ai"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: JobQueueSamplerStopped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The job queue has not been sampled for over 5 minutes"
              runbook_url: "docs/runbooks/alerts.md#jobqueuesamplerstopped"

  # Jobs failing for good: 10% of runs on the intake lane.
  - interval: 1m
    input_series:
      - series: 'listenup_job_runs_total{job_name="content.convert_upload",lane="intake",outcome="succeeded"}'
        values: '0+1.8x60'
      - series: 'listenup_job_runs_total{job_name="content.convert_upload",lane="intake",outcome="failed"}'
        values: '0+0.2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: JobFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              lane: intake
            exp_annotations:
              summary: "10% of jobs on lane intake are failing"
              runbook_url: "docs/runbooks/alerts.md#jobfailureratehigh"

  # A spike of 5xx answers (10% of 100 requests a minute) fires; 1% does not.
  - interval: 1m
    input_series:
      - series: 'listenup_http_server_requests_total{method="GET",route="/api/v1/library",status_class="2xx"}'
        values: '0+90x30'
      - series: 'listenup_http_server_requests_total{method="GET",route="/api/v1/library",status_class="5xx"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiErrorRateSpike
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "10% of API requests fail with 5xx"
              runbook_url: "docs/runbooks/alerts.md#apierrorratespike"
  - interval: 1m
    input_series:
      - series: 'listenup_http_server_requests_total{method="GET",route="/api/v1/library",status_class="2xx"}'
        values: '0+99x30'
      - series: 'listenup_http_server_requests_total{method="GET",route="/api/v1/library",status_class="5xx"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: ApiErrorRateSpike
        exp_alerts: []

  # A backup 30 hours old fires; one from 2 hours ago does not.
  - interval: 1m
    input_series:
      - series: 'listenup_backup_last_success_timestamp_seconds'
        values: '-100800x60'  # 28 h before the test's time zero
    alert_rule_test:
      - eval_time: 45m
        alertname: BackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No database backup in over 26 hours"
              runbook_url: "docs/runbooks/alerts.md#backupmissing"
  - interval: 1m
    input_series:
      - series: 'listenup_backup_last_success_timestamp_seconds'
        values: '-7200x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: BackupMissing
        exp_alerts: []
