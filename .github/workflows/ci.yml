name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-evals-changes:
    name: Detect AI smoke paths
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.paths.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          smoke=$(bash .github/scripts/ai-evals-changes.sh)
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  ai-evals-smoke:
    name: AI evals (synthetic offline smoke)
    needs: ai-evals-changes
    if: needs.ai-evals-changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: listenup
          POSTGRES_PASSWORD: listenup
          POSTGRES_DB: listenup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U listenup -d listenup"
          --health-interval 2s --health-retries 30
    env:
      LISTENUP_DATABASE_URL: postgresql://listenup:listenup@localhost:5432/listenup
      LISTENUP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run alembic upgrade head
      - name: Run both synthetic subsets through the report gate
        env:
          REVISION: ${{ github.sha }}
        run: |
          result=0
          for suite in gist shadow; do
            if ! uv run ai-evals --offline --smoke \
              --dataset "../../ai-evals/fixtures/$suite.json" \
              --thresholds ../../ai-evals/smoke.thresholds.json \
              --ai-config src/listenup/ai/ai.fake.yaml \
              --revision "$REVISION" \
              --report "../../work/ai-evals/$suite.json"; then
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evals-synthetic-smoke
          path: work/ai-evals/
          if-no-files-found: error
          retention-days: 14

  branch-name:
    name: Branch name is readable and auditable
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'push' && github.ref_type == 'branch' &&
       github.actor != 'dependabot[bot]' &&
       !startsWith(github.ref_name, 'dependabot/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch name
        # Owner-approved legacy exception for existing PR #133 only.
        # Remove this exception after that PR closes.
        if: >-
          !((github.event_name == 'pull_request' &&
             github.event.pull_request.number == 133 &&
             github.head_ref == 'claude/confident-darwin-wemfu6' &&
             github.event.pull_request.head.repo.full_name == 'abubakar1010/ListenUp') ||
            (github.event_name == 'push' &&
             github.repository == 'abubakar1010/ListenUp' &&
             github.ref_name == 'claude/confident-darwin-wemfu6'))
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/check-branch-name.sh "$BRANCH_NAME"

  backend:
    name: Backend (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: listenup
          POSTGRES_PASSWORD: listenup
          POSTGRES_DB: listenup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U listenup -d listenup"
          --health-interval 2s --health-retries 30
    env:
      LISTENUP_DATABASE_URL: postgresql://listenup:listenup@localhost:5432/listenup
      # Integration tests fail instead of skipping when PostgreSQL or storage is missing.
      LISTENUP_REQUIRE_DB: "1"
      LISTENUP_REQUIRE_S3: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check . ../../.github/scripts/check-coverage.py
      - run: uv run ruff format --check . ../../.github/scripts/check-coverage.py
      - run: uv run mypy
      - name: Coverage tooling types
        run: uv run mypy ../../.github/scripts/check-coverage.py tests/unit/test_coverage_gate.py
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - name: Migrations (upgrade, downgrade one, upgrade, drift check)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check
      - name: Install ffmpeg (conversion tests) and the PostgreSQL 16 client (backup tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-16
      - name: Start S3 storage (SeaweedFS, as in Docker Compose)
        working-directory: .
        run: |
          docker run -d --name storage -p 9000:9000 \
            -v "$PWD/infra/compose/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 60); do
            if docker exec storage sh -c "echo cluster.check | weed shell -master=localhost:9333" \
                 >/dev/null 2>&1 && curl -s -o /dev/null http://localhost:9000; then
              exit 0
            fi
            sleep 2
          done
          docker logs storage
          exit 1
      - name: Tests with line and branch coverage
        run: uv run pytest -m 'not performance' --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html
      - name: Backend coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Performance budgets without coverage overhead
        run: uv run pytest -m performance --no-cov
      - name: Spike harness regression tests (production pure helpers)
        working-directory: spikes
        run: |
          uv sync --frozen --python 3.12
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  web:
    name: Web (lint, format, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Web coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: error
          retention-days: 14
      - run: pnpm build
      - name: Initial JavaScript within budget
        run: pnpm size

  changed-coverage:
    name: Changed executable lines (90% per app)
    if: github.event_name == 'pull_request'
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the merge base, including on fork pull requests.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --python 3.12 --project apps/api
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: apps/api/coverage
      - uses: actions/download-artifact@v8
        with:
          name: web-coverage
          path: apps/web/coverage
      - name: Backend changed-line coverage
        working-directory: apps/api
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          uv run python ../../.github/scripts/check-coverage.py api coverage/coverage.xml
          uv run diff-cover coverage/coverage.xml --compare-branch "$BASE_SHA" \
            --ignore-staged --ignore-unstaged --fail-under 90
      - name: Web changed-line coverage
        working-directory: apps/web
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          ../api/.venv/bin/python ../../.github/scripts/check-coverage.py web coverage/cobertura-coverage.xml
          ../api/.venv/bin/diff-cover coverage/cobertura-coverage.xml --compare-branch "$BASE_SHA" \
            --ignore-staged --ignore-unstaged --fail-under 90

  e2e:
    name: Web smoke test (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  a11y:
    # axe on every route and main state at 1280 px, 360 px and in the dark theme;
    # serious and critical WCAG 2.1 A/AA violations fail (#98, NFR-USE-2, UI-4).
    name: Accessibility (axe, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:a11y
      # The report holds each state's full axe results, including moderate and minor ones.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: apps/web/playwright-report
          retention-days: 14

  api-contract:
    name: API client matches the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Export the OpenAPI schema
        working-directory: apps/api
        run: uv sync --frozen --python 3.12 && uv run python scripts/export_openapi.py
      - name: Regenerate the TypeScript types
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm api:generate
      - name: Fail if the committed client is out of date
        run: |
          git diff --exit-code -- apps/web/src/api \
            || { echo "::error::Run scripts/export_openapi.py and pnpm api:generate, then commit the result."; exit 1; }

  alerts:
    name: Alert rules and observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules are valid
        run: |
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Each alert fires on simulated data (and only then)
        run: |
          docker run --rm -v "$PWD/infra/observability:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            test rules alerts.test.yml
      - name: Alertmanager config is valid
        run: |
          docker run --rm -v "$PWD/infra/observability:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /cfg/alertmanager.yml

  media-sandbox:
    name: Media sandbox (Docker and real scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # No speech weights or production signature CDN downloads for this contract.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          target: media-runtime
          tags: listenup-media-check:ci
          load: true
          cache-from: |
            type=gha,scope=media-runtime
            type=gha,scope=worker-media
          cache-to: type=gha,mode=max,scope=media-runtime
      - name: Enforce the deployed media boundary and scan EICAR
        run: python infra/scripts/check-media-sandbox.py listenup-media-check:ci

  images:
    name: Docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, worker-media, backup]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - name: Python (pip-audit)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt
      - name: JavaScript (pnpm audit)
        working-directory: apps/web
        run: pnpm audit --audit-level=high
