[project]
name = "listenup-spikes"
version = "0.1.0"
description = "Benchmark harness for the ListenUp technical spikes (epic #5). Not application code."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# #17 YouTube intake
youtube = ["yt-dlp"]
# B1, B4: transcription
transcribe = ["faster-whisper>=1.1"]
# B2, #20, B3: alignment, phoneme scoring, pitch. torchaudio's MMS_FA aligner is in
# maintenance mode upstream, so keep it below 2.9 until the spike settles the model.
speech = ["torch>=2.4,<2.9", "torchaudio>=2.4,<2.9", "praat-parselmouth>=0.4", "soundfile>=0.12"]

[project.scripts]
spike-youtube = "listenup_spikes.youtube_intake:main"
spike-b1 = "listenup_spikes.b1_transcribe:main"
spike-b2 = "listenup_spikes.b2_align:main"
spike-b4 = "listenup_spikes.b4_fillers:main"
spike-shadow = "listenup_spikes.shadow_prototype:main"
spike-librispeech = "listenup_spikes.datasets:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listenup_spikes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
