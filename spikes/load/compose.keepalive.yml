# B5 diagnostic only (#94): the API's keep-alive above the 5 s heartbeat interval.
# uvicorn closes an idle connection after 5 s by default, the same as the heartbeat
# interval, so a heartbeat that reuses the connection can meet the close. Add this file
# after compose.b5.yml to reproduce the historical 10 s diagnostic. Since #216,
# normal API commands use 30 s; this remains a diagnostic, not the deployed setting.
services:
  api:
    command: uvicorn listenup.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 5 --timeout-keep-alive 10
